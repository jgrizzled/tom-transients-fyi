[project]
name = "tom-transients-fyi"
description = "A TOM Toolkit data service for transients.fyi: a view's objects and their light curves, with limits, as targets"
authors = [{ name = "Justin Greene", email = "justin.greene5@gmail.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "tomtoolkit>=3.0.0,<4",
    "requests>=2.28,<3",
]

[project.urls]
Homepage = "https://transients.fyi/data"

[dependency-groups]
dev = [
    "factory-boy>=3.2.1,<3.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the git tag (v0.1.0 -> 0.1.0); untagged commits get a dev version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["tom_transients_fyi"]
exclude = ["tom_transients_fyi/tests"]

[tool.hatch.build.targets.sdist]
include = ["tom_transients_fyi", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
