name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs it before publishing

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags since v8
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags since v8
      - run: uv sync --locked
      - run: uv run python tom_transients_fyi/tests/check_migrations.py

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags since v8
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python tom_transients_fyi/tests/run_tests.py
